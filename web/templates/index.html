<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw AI 工具库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #5568d3;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-button {
            padding: 10px 16px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .search-results {
            max-height: 600px;
            overflow-y: auto;
        }

        .result-item {
            padding: 15px;
            border: 1px solid #e0e0e0;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .result-item:hover {
            background: #f9f9f9;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102,126,234,0.15);
        }

        .result-item h3 {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .result-item p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .result-meta {
            display: flex;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.85em;
            color: #999;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .card-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .card-item:last-child {
            border-bottom: none;
        }

        .card-item strong {
            color: #333;
        }

        .card-item span {
            float: right;
            color: #667eea;
            font-weight: bold;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #f9f9f9;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .rank-badge {
            background: #667eea;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .rank-title {
            flex: 1;
            color: #333;
        }

        .bottom-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .chart-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .tab-button {
                padding: 8px 12px;
                font-size: 0.9em;
            }
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OpenClaw AI 工具库</h1>
            <p>发现和探索最新的AI工具和应用</p>
        </header>

        <div class="main-content">
            <div class="search-section">
                <h2 style="color: #333; margin-bottom: 20px;">搜索工具</h2>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="输入工具名称或关键词...">
                    <button onclick="performSearch()">搜索</button>
                </div>

                <div class="tabs">
                    <button class="tab-button active" onclick="switchTab('search')">搜索结果</button>
                    <button class="tab-button" onclick="switchTab('recent')">最近搜索</button>
                    <button class="tab-button" onclick="switchTab('hot')">热门搜索</button>
                </div>

                <div class="search-results" id="results">
                    <div class="loading">输入查询开始搜索...</div>
                </div>
            </div>

            <div class="sidebar">
                <div class="card">
                    <h2>系统统计</h2>
                    <div id="stats">
                        <div class="loading-spinner"></div>
                    </div>
                </div>

                <div class="card">
                    <h2>今日排行</h2>
                    <div class="ranking-list" id="dailyRanking">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-section">
            <h2 class="section-title">热门榜单和报告</h2>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-bottom: 30px;">
                <div>
                    <h3 style="color: #333; margin-bottom: 15px;">最近7天热门</h3>
                    <div class="ranking-list" id="hotRanking">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
                <div>
                    <h3 style="color: #333; margin-bottom: 15px;">评分排行</h3>
                    <div class="ranking-list" id="scoreRanking">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>

            <div>
                <h3 style="color: #333; margin-bottom: 15px;">系统统计</h3>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-box">
                        <div class="stat-number" id="stat-tools">-</div>
                        <div class="stat-label">工具总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat-searches">-</div>
                        <div class="stat-label">搜索总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat-categories">-</div>
                        <div class="stat-label">类别数</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat-score">-</div>
                        <div class="stat-label">平均评分</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadDailyRanking();
            loadHotRanking();
            loadScoreRanking();
            loadRecentSearches();
        });

        // 按Enter搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('results').innerHTML = '<div class="loading-spinner"></div>';

            fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query, type: 'hybrid', top_k: 10})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('results').innerHTML = `<div class="error">${data.error}</div>`;
                } else {
                    renderResults(data.results);
                }
            })
            .catch(e => {
                document.getElementById('results').innerHTML = `<div class="error">搜索失败: ${e.message}</div>`;
            });
        }

        function renderResults(results) {
            if (!results || results.length === 0) {
                document.getElementById('results').innerHTML = '<div class="error">未找到相关结果</div>';
                return;
            }

            const html = results.map(r => {
                const tool = r.tool || {};
                return `
                    <div class="result-item">
                        <h3>${tool.title || tool.tool_name}</h3>
                        <p>${tool.summary || tool.content || '暂无描述'}</p>
                        <div class="result-meta">
                            <span>来源: ${tool.source || '未知'}</span>
                            <span>类型: ${tool.tool_type || '未分类'}</span>
                            ${r.combined_score ? `<span>相似度: ${(r.combined_score * 100).toFixed(0)}%</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('results').innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'recent') {
                loadRecentSearches();
            } else if (tab === 'hot') {
                loadHotSearches();
            }
        }

        function loadStats() {
            fetch('/api/stats')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    const s = data.stats;
                    document.getElementById('stat-tools').textContent = s.total_tools;
                    document.getElementById('stat-searches').textContent = s.total_searches;
                    document.getElementById('stat-categories').textContent = s.categories;
                    document.getElementById('stat-score').textContent = s.average_score.toFixed(1);

                    // 侧边栏统计
                    document.getElementById('stats').innerHTML = `
                        <div class="card-item">
                            <strong>工具总数</strong>
                            <span>${s.total_tools}</span>
                        </div>
                        <div class="card-item">
                            <strong>搜索总数</strong>
                            <span>${s.total_searches}</span>
                        </div>
                        <div class="card-item">
                            <strong>类别数</strong>
                            <span>${s.categories}</span>
                        </div>
                        <div class="card-item">
                            <strong>平均评分</strong>
                            <span>${s.average_score.toFixed(1)}</span>
                        </div>
                    `;
                }
            })
            .catch(e => console.error('加载统计失败', e));
        }

        function loadDailyRanking() {
            fetch('/api/rankings/daily')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('dailyRanking').innerHTML = data.ranking.slice(0, 5).map(r => `
                        <div class="ranking-item">
                            <div class="rank-badge">${r.rank}</div>
                            <div class="rank-title">${r.title}</div>
                        </div>
                    `).join('');
                }
            })
            .catch(e => console.error('加载排行失败', e));
        }

        function loadHotRanking() {
            fetch('/api/rankings/hot?days=7&limit=5')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('hotRanking').innerHTML = data.ranking.map(r => `
                        <div class="ranking-item">
                            <div class="rank-badge">${r.rank}</div>
                            <div class="rank-title">${r.title}</div>
                        </div>
                    `).join('');
                }
            })
            .catch(e => console.error('加载热门失败', e));
        }

        function loadScoreRanking() {
            fetch('/api/rankings/score?limit=5')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('scoreRanking').innerHTML = data.ranking.map(r => `
                        <div class="ranking-item">
                            <div class="rank-badge">${r.rank}</div>
                            <div class="rank-title">${r.title}</div>
                        </div>
                    `).join('');
                }
            })
            .catch(e => console.error('加载评分排行失败', e));
        }

        function loadRecentSearches() {
            fetch('/api/search-history?limit=10')
            .then(r => r.json())
            .then(data => {
                if (data.success && data.history.length > 0) {
                    document.getElementById('results').innerHTML = data.history.map((h, i) => `
                        <div class="result-item" onclick="document.getElementById('searchInput').value='${h.keyword}'; performSearch();">
                            <h3>${h.keyword}</h3>
                            <p>搜索时间: ${new Date(h.searched_at).toLocaleString()}</p>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('results').innerHTML = '<div class="loading">暂无搜索历史</div>';
                }
            })
            .catch(e => console.error('加载搜索历史失败', e));
        }

        function loadHotSearches() {
            fetch('/api/hot-searches?limit=10')
            .then(r => r.json())
            .then(data => {
                if (data.success && data.hot_searches.length > 0) {
                    document.getElementById('results').innerHTML = data.hot_searches.map((h, i) => `
                        <div class="result-item" onclick="document.getElementById('searchInput').value='${h.keyword}'; performSearch();">
                            <h3>${h.keyword}</h3>
                            <p>搜索次数: ${h.count} | 最后搜索: ${new Date(h.last_searched).toLocaleString()}</p>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('results').innerHTML = '<div class="loading">暂无热门搜索</div>';
                }
            })
            .catch(e => console.error('加载热门搜索失败', e));
        }
    </script>
</body>
</html>
